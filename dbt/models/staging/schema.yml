version: 2

models:
  - name: stg_users
    description: "Cleaned user data."
    columns:
      - name: user_id
        tests:
          - unique
          - not_null
      - name: email
        tests:
          - unique
          - not_null
      - name: is_active
        tests:
          - not_null

  - name: stg_price_alerts
    description: "User price alert configuration."
    columns:
      - name: price_alert_id
        tests:
          - unique
          - not_null
      - name: user_id
        tests:
          - not_null
      - name: direction
        tests:
          - accepted_values:
              values: ["above", "below"]
      - name: target_price
        tests:
          - not_null

  - name: stg_notifications
    description: "Generated notifications."
    columns:
      - name: notification_id
        tests:
          - unique
          - not_null
      - name: user_id
        tests:
          - not_null
      - name: notification_type
        tests:
          - accepted_values:
              values: ["daily_prediction", "price_target"]
      - name: status
        tests:
          - accepted_values:
              values: ["pending", "sent", "failed"]

  - name: stg_predictions
    description: "ML predictions generated by the prediction pipeline."
    columns:
      - name: prediction_id
        tests:
          - unique
          - not_null
      - name: symbol
        tests:
          - not_null
      - name: trend
        tests:
          - accepted_values:
              values: ["hausse", "baisse", "stagnation"]

  - name: stg_model_metrics
    description: "Stored ML model metrics."
    columns:
      - name: metric_id
        tests:
          - unique
          - not_null
      - name: symbol
        tests:
          - not_null

  - name: stg_ccxt_ohlcv
    description: "Historical OHLCV data collected from Binance."
    columns:
      - name: ohlcv_id
        tests:
          - unique
          - not_null
      - name: symbol
        tests:
          - not_null

  - name: stg_features_crypto
    description: "Feature engineering output used by ML models."
    columns:
      - name: feature_id
        tests:
          - unique
          - not_null
      - name: symbol
        tests:
          - not_null