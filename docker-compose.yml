services:
  db:
    image: postgres:16
    container_name: crypto_postgres
    environment:
      POSTGRES_DB: crypto_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    container_name: crypto_api
    env_file:
      - .env.docker
    depends_on:
      - db
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000

  dashboard:
    build: .
    container_name: crypto_dashboard
    env_file:
      - .env.docker
    depends_on:
      - api
    ports:
      - "8501:8501"
    volumes:
      - .:/app
    command: streamlit run dashboard/dashboard.py --server.address=0.0.0.0 --server.port=8501

  pipeline:
    build: .
    container_name: crypto_pipeline
    env_file:
      - .env.docker
    depends_on:
      - db
    volumes:
      - .:/app
    command: python run_pipeline.py
    profiles:
      - manual

volumes:
  postgres_data: