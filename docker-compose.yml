# Architecture Docker du projet Crypto Alerts.
#
# Les services couvrent l'ensemble de la chaîne Data :
# - collecte des données ;
# - stockage PostgreSQL ;
# - transformation (dbt) ;
# - entraînement et prédiction ML ;
# - API FastAPI ;
# - dashboard Streamlit ;
# - orchestration Airflow ;
# - supervision Prometheus + Grafana + cAdvisor.
services:
  # Base PostgreSQL principale contenant :
  # utilisateurs, données de marché, features, prédictions et notifications.
  db:
    image: postgres:16
    container_name: crypto_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Interface d'administration PostgreSQL.
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: crypto_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "5050:80"
    depends_on:
      - db

  # Base PostgreSQL dédiée à Airflow.
  airflow-db:
    image: postgres:16
    container_name: airflow_postgres
    environment:
      POSTGRES_DB: ${AIRFLOW_POSTGRES_DB}
      POSTGRES_USER: ${AIRFLOW_POSTGRES_USER}
      POSTGRES_PASSWORD: ${AIRFLOW_POSTGRES_PASSWORD}
    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data

  # API REST FastAPI exposant les données du projet
  # ainsi que les métriques Prometheus.   
  api:
    build: .
    container_name: crypto_api
    env_file:
      - .env.docker
    depends_on:
      - db
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000

  # Dashboard Streamlit de visualisation.
  dashboard:
    build: .
    container_name: crypto_dashboard
    env_file:
      - .env.docker
    depends_on:
      - api
    ports:
      - "8501:8501"
    volumes:
      - .:/app
    command: streamlit run dashboard/dashboard.py --server.address=0.0.0.0 --server.port=8501

  # Pipeline complet exécuté manuellement
  # (collecte → features → entraînement → prédiction).
  pipeline:
    build: .
    container_name: crypto_pipeline
    env_file:
      - .env.docker
    depends_on:
      - db
    volumes:
      - .:/app
    command: python run_pipeline.py
    profiles:
      - manual

  # Exécution manuelle des transformations dbt.
  dbt:
    build: .
    container_name: crypto_dbt
    env_file:
      - .env.docker
    depends_on:
      - db
    volumes:
      - .:/app
      - ./dbt/profiles.yml.example:/root/.dbt/profiles.yml
    working_dir: /app/dbt
    command: dbt run
    profiles:
      - manual

  # Initialise Airflow :
  # migration de la base et création du compte administrateur.
  airflow-init:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: airflow_init
    depends_on:
      - airflow-db
    env_file:
      - .env.docker
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW_DATABASE_URL}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    volumes:
      - .:/app
      - ./airflow/dags:/opt/airflow/dags
      - airflow_logs:/opt/airflow/logs
    command: >
      bash -c "
      airflow db migrate &&
      airflow users create
      --username ${AIRFLOW_ADMIN_USERNAME}
      --password ${AIRFLOW_ADMIN_PASSWORD}
      --firstname ${AIRFLOW_ADMIN_FIRSTNAME}
      --lastname ${AIRFLOW_ADMIN_LASTNAME}
      --role ${AIRFLOW_ADMIN_ROLE}
      --email ${AIRFLOW_ADMIN_EMAIL} || true
      "

  # Interface web Airflow.
  airflow-webserver:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: airflow_webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    env_file:
      - .env.docker
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW_DATABASE_URL}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    ports:
      - "8080:8080"
    volumes:
      - .:/app
      - ./airflow/dags:/opt/airflow/dags
      - airflow_logs:/opt/airflow/logs
    command: airflow webserver

  # Orchestrateur exécutant les DAGs planifiés.
  airflow-scheduler:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: airflow_scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    env_file:
      - .env.docker
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW_DATABASE_URL}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    volumes:
      - .:/app
      - ./airflow/dags:/opt/airflow/dags
      - airflow_logs:/opt/airflow/logs
    command: airflow scheduler

  # Collecte les métriques exposées par les services.
  prometheus:
    image: prom/prometheus:latest
    container_name: crypto_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"

  # Dashboard de supervision connecté à Prometheus.
  grafana:
    image: grafana/grafana:11.5.2
    container_name: crypto_grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus

  # Expose les métriques CPU, RAM et ressources des conteneurs Docker.
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: crypto_cadvisor
    ports:
      - "8081:8080"
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /var/lib/containerd:/var/lib/containerd:ro
    command:
      - "--docker_only=true"
      - "--housekeeping_interval=10s"

  # Stream temps réel chargé de déclencher les alertes de prix.
  price-alert-stream:
    build: .
    container_name: crypto_price_alert_stream
    env_file:
      - .env.docker
    depends_on:
      - db
    volumes:
      - .:/app
    command: python streaming/price_alert_stream.py

  # Stream temps réel mettant à jour les dernières bougies de marché.
  market-stream:
    build: .
    container_name: crypto_market_stream
    env_file:
      - .env.docker
    depends_on:
      - db
    volumes:
      - .:/app
    command: python streaming/market_stream.py

# Volumes persistants utilisés par les différents services.
volumes:
  postgres_data:
  airflow_postgres_data:
  airflow_logs:
  prometheus_data:
  grafana_data: